<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScoopLab — Uchucchacua</title>
<link rel="icon" href="scooplab.ico" sizes="any">
<link rel="icon" href="scooplab.png" type="image/png">
<link rel="stylesheet" href="rockwedge.css">
</head>
<body>

<!-- fondo permanente: render 3D del equipo seleccionado -->
<canvas id="escena"></canvas>
<div id="escena-vacia" hidden>render 3D no disponible</div>

<!-- ficha del equipo seleccionado -->
<aside id="hud"></aside>

<!-- selector de equipo -->
<aside id="selector"></aside>

<!-- camara de la escena 3D -->
<div id="camaras">
  <span class="segmentado" id="segCam">
    <button data-cam="orbita" class="sel" data-tip="Girar: clic izq. · Desplazar: clic der. · Zoom: rueda, hacia el cursor">Orbita</button>
    <button data-cam="vuelo" data-tip="WASD mover · Q/E bajar y subir · Shift rapido · arrastrar para mirar">Vuelo</button>
    <button data-cam="caminar" data-tip="Recorrer la galeria a pie: WASD y arrastrar para mirar">Caminar</button>
    <button data-cam="seguir" data-tip="Camara detras del equipo">Seguir</button>
    <button data-cam="cabina" data-tip="Vista del operador">Cabina</button>
  </span>
  <span class="segmentado" id="segVistas" hidden></span>
  <span class="segmentado" id="segEstilo" hidden>
    <button data-estilo="corte" class="sel" data-tip="Solo la cara interior: la galeria se ve en corte desde afuera">Corte</button>
    <button data-estilo="transparente" data-tip="Agrega el contorno exterior en transparencia">Transparente</button>
  </span>
  <div id="ayudaCam"></div>
</div>

<!-- casos de simulacion: cada uno es un trazo con su terreno y su resultado -->
<div id="casos" hidden>
  <div class="h">CASO DE SIMULACION</div>
  <select id="selCaso" data-tip="Cambia el trazo de galerias"></select>
  <div class="d" id="casoLectura"></div>
</div>

<!-- planta de la red: un clic lleva la camara a ese punto -->
<canvas id="minimapa" hidden data-tip="Clic para ir a ese punto"></canvas>

<!-- modo de la escena 3D -->
<div id="modos">
  <span class="segmentado" id="segModo">
    <button data-modo="ficha" class="sel" data-tip="Una unidad en la labor, con cotas">Ficha</button>
    <button data-modo="ciclo" data-tip="El ciclo del Excel a nivel: frente, maniobra y echadero">Ciclo</button>
    <button data-modo="equivalencia" data-tip="Cuantos equipos diesel igualan al electrico">Equivalencia</button>
    <button data-modo="simulacion" data-tip="Operacion completa: frente, rampas y echadero">Simulacion</button>
  </span>
  <span class="segmentado" id="segMetaEq" hidden>
    <button data-m="500">500</button><button data-m="750">750</button>
    <button data-m="1000" class="sel">1000</button><button data-m="1500">1500</button>
    <button data-m="2000">2000</button>
  </span>
  <span class="segmentado" id="segVel" hidden>
    <button data-vel="1" class="sel" data-tip="Tiempo real: la velocidad que se ve es la del calculo">1×</button>
    <button data-vel="2" data-tip="El doble del tiempo real">2×</button>
    <button data-vel="4">4×</button>
    <button data-vel="8">8×</button>
  </span>
  <div id="faseCiclo"></div>
  <div id="reproductor" hidden>
    <button class="rp" id="rpInicio" data-tip="Volver al inicio"></button>
    <button class="rp" id="rpPlay" data-tip="Reproducir o pausar"></button>
    <input type="range" id="rpBarra" min="0" max="1000" value="0" step="1"
           data-tip="Arrastrar para adelantar o retroceder">
    <div class="rp-lectura" id="rpLectura"></div>
  </div>
</div>

<!-- ventanas flotantes -->
<div id="ventanas"></div>

<!-- barra de tareas -->
<nav id="barra">
  <button class="inicio" id="inicio" data-tip="Mostrar el render (minimiza todo)">
    <span class="mk"></span><b>SCOOPLAB</b><span class="eng">v1.0</span>
  </button>
  <div class="sep"></div>
  <div class="tareas" id="tareas"></div>
  <div class="sep"></div>
  <div class="bandeja">
    <button class="tp" id="tpUnidad" data-tip="Alternar TCS / tonelada metrica">TCS</button>
    <button class="tp" id="tpTema" data-tip="Alternar tema claro / oscuro">◐</button>
    <div class="reloj" id="reloj"><b>--:--</b><span>--</span></div>
  </div>
</nav>

<!-- three.js y complementos como modulos ES, servidos desde ui/vendor (sin internet) -->
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.min.js",
    "three-mesh-bvh": "./vendor/three-mesh-bvh.module.js",
    "three-bvh-csg": "./vendor/three-bvh-csg.module.js"
} }
</script>
<script src="iconos.js"></script>
<script type="module" src="render3d.js" onerror="window.dispatchEvent(new Event('render3d-listo'))"></script>
<script src="vistas.js"></script>
<script src="app.js"></script>
</body>
</html>
